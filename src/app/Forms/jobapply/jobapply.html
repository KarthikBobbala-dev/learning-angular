    <mat-tab-group class="tab-group">
      <mat-tab label="Personal details">
        <form class="tab-form">
          <p class="tab-intro">How can we reach you?</p>
          <div class="form-row">
            <div class="formfield">
              <label for="personalFirstName">First name</label>
              <input id="personalFirstName" type="text" placeholder="Enter your first name" />
            </div>
            <div class="formfield">
              <label for="personalLastName">Last name</label>
              <input id="personalLastName" type="text" placeholder="Enter your last name" />
            </div>
          </div>
          <div class="form-row">
            <div class="formfield">
              <label for="email">Email</label>
              <input id="email" type="email" placeholder="name@email.com" />
            </div>
            <div class="formfield">
              <label for="phone">Phone</label>
              <input id="phone" type="tel" placeholder="9876543210" />
            </div>
          </div>
          <div class="formfield">
            <label for="personalAddress">Address</label>
            <input id="personalAddress" type="text" placeholder="Street, city, state" />
          </div>
          <button class="submit" type="button">Save personal details <span aria-hidden="true">→</span></button>
        </form>
      </mat-tab>

      <mat-tab label="Position details">
        <form class="tab-form">
          <p class="tab-intro">Tell us about the role you want.</p>
          <div class="form-row">
            <div class="formfield">
              <label for="jobPosition">Applying for</label>
              <select id="jobPosition">
                <option value="frontend">Front End Developer</option>
                <option value="backend">Back End Developer</option>
                <option value="ai">AI Engineer</option>
              </select>
            </div>
            <div class="formfield">
              <label for="experience">Experience</label>
              <select id="experience">
                <option value="0-1">0 – 1 years</option>
                <option value="1-3">1 – 3 years</option>
                <option value="3-5">3 – 5 years</option>
                <option value="5+">5+ years</option>
              </select>
            </div>
          </div>
          <div class="formfield">
            <label for="skills">Skills</label>
            <input id="skills" type="text" placeholder="Angular, TypeScript, RxJS" />
          </div>
          <div class="formfield">
            <label for="about">About you</label>
            <textarea id="about" rows="4" placeholder="A short note about your work"></textarea>
          </div>
          <button class="submit" type="button">Save position details <span aria-hidden="true">→</span></button>
        </form>
      </mat-tab>
    </mat-tab-group>
  </section>
</main>
